<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEFR – Under construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: white;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .message-box {

            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05);

            margin: 1rem 0;

            margin-top: 1.5rem;
            background: #2c3e50;

            text-decoration: none;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 500;
            transition: 0.2s;
        }
        .back-home:hover {
            background: #1a2a3a;
        }

            font-size: 3rem;
