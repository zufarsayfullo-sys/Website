  // Build the split screen with passage and questions
  function renderFullPage() {
    const app = document.getElementById('app');
    // passage HTML
    const passageHtml = `
      <div class="split-layout">
        <div class="passage-col">
          <div class="highlight-toolbar">
            <div class="color-btn yellow" data-color="yellow"></div>
            <div class="color-btn green" data-color="green"></div>
            <div class="color-btn pink" data-color="pink"></div>
            <button class="clear-highlight" id="clearHighlightsBtn">Clear highlights</button>
          </div>
          <div class="passage-title">The growth of bike-sharing schemes around the world <span class="difficulty-badge">Medium</span></div>
          <div class="passage-text" id="passageText">
            <p><strong>A</strong> The original idea for an urban bike-sharing scheme dates back to a summer’s day in Amsterdam in 1965. Provo, the organization that came up with the idea, was a group of Dutch activists who wanted to change society. They believed the scheme, which was known as the Witte Fietsenplan, was an answer to the perceived threats of air pollution and consumerism. In the centre of Amsterdam, they painted a small number of used bikes white. They also distributed leaflets describing the dangers of cars and inviting people to use the white bikes. The bikes were then left unlocked at various locations around the city, to be used by anyone in need of transport.</p>
            <p><strong>B</strong> Luud Schimmelpennink, a Dutch industrial engineer who still lives and cycles in Amsterdam, was heavily involved in the original scheme. He recalls how the scheme succeeded in attracting a great deal of attention – particularly when it came to publicising Provo’s aims – but struggled to get off the ground. The police were opposed to Provo’s initiatives and almost as soon as the white bikes were distributed around the city, they removed them. However, for Schimmelpennink and for bike-sharing schemes in general, this was just the beginning. ‘The first Witte Fietsenplan was just a symbolic thing,’ he says. ‘We painted a few bikes white, that was all. Things got more serious when I became a member of the Amsterdam city council two years later.’</p>
            <p><strong>C</strong> Schimmelpennink seized this opportunity to present a more elaborate Witte Fietsenplan to the city council. ‘My idea was that the municipality of Amsterdam would distribute 10,000 white bikes over the city, for everyone to use,’ he explains. ‘I made serious calculations. It turned out that a white bicycle – per person, per kilometer – would cost the municipality only 10% of what it contributed to public transport per person per kilometer.’ Nevertheless, the council unanimously rejected the plan. ‘They said that the bicycle belongs to the past. They saw a glorious future for the car,’ says Schimmelpennink. But he was not in the least discouraged.</p>
            <p><strong>D</strong> Schimmelpennink never stopped believing in bike-sharing, and in the mid-90s, two Danes asked for his help to set up a system in Copenhagen. The result was the world’s first large-scale bike-share programme. It worked on a deposit: ‘You dropped a coin in the bike and when you returned it, you got your money back.’ After setting up the Danish system, Schimmelpennink decided to try his luck again in the Netherlands – and this time he succeeded in arousing the interest of the Dutch Ministry of Transport. ‘Times had changed,’ he recalls. ‘People had become more environmentally conscious, and the Danish experiment had proved that bike-sharing was a real possibility.’ A new Witte Fietsenplan was launched in 1999 in Amsterdam. However, riding a white bike was no longer free; it cost one guilder per trip and payment was made with a chip card developed by the Dutch bank Postbank. Schimmelpennink designed conspicuous, sturdy white bikes locked in special racks which could be opened with the chip card – the plan started with 250 bikes, distributed over five stations.</p>
            <p><strong>E</strong> Theo Molenaar, who was a system designer for the project, worked alongside Schimmelpennink. ‘I remember when we were testing the bike racks, he announced that he had already designed better ones. But of course, we had to go through with the ones we had.’ The system, however, was prone to vandalism and theft. ‘After every weekend there would always be a couple of bikes missing,’ Molenaar says. ‘I really have no idea what people did with them, because they could instantly be recognised as white bikes.’ But the biggest blow came when Postbank decided to abolish the chip card, because it wasn’t profitable. ‘That chip card was pivotal to the system,’ Molenaar says. ‘To continue the project we would have needed to set up another system, but the business partner had lost interest.’</p>
            <p><strong>F</strong> Schimmelpennink was disappointed, but – characteristically – not for long. In 2002 he got a call from the French advertising corporation JC Decaux, who wanted to set up his bike-sharing scheme in Vienna. ‘That went really well. After Vienna, they set up a system in Lyon. Then in 2007, Paris followed. That was a decisive moment in the history of bike-sharing.’ The huge and unexpected success of the Parisian bike-sharing programme, which now boasts more than 20,000 bicycles, inspired cities all over the world to set up their own schemes, all modelled on Schimmelpennink’s. ‘It’s wonderful that this happened,’ he says. ‘But financially I didn’t really benefit from it, because I never filed for a patent.’</p>
            <p><strong>G</strong> In Amsterdam today, 38% of all trips are made by bike and, along with Copenhagen, it is regarded as one of the two most cycle-friendly capitals in the world – but the city never got another Witte Fietsenplan. Molenaar believes this may be because everybody in Amsterdam already has a bike. Schimmelpennink, however, cannot see that this changes Amsterdam’s need for a bike-sharing scheme. ‘People who travel on the underground don’t carry their bikes around. But often they need additional transport to reach their final destination.’ Although he thinks it is strange that a city like Amsterdam does not have a successful bike-sharing scheme, he is optimistic about the future. ‘In the ‘60s we didn’t stand a chance because people were prepared to give their lives to keep cars in the city. But that mentality has totally changed. Today everybody longs for cities that are not dominated by cars.’</p>

          <button class="submit-btn" id="submitBtn">Submit Answers</button>
        </div>

    `;

  // define questions (hardcoded as per passage)
  function buildQuestionsUI() {
    const container = document.getElementById('questionsContainer');
    const questionsData = [
      { type: 'mc-paragraph', text: '14. Which paragraph contains a description of how people misused a bike-sharing scheme?', options: ['A','B','C','D','E','F','G'], correct: 'E' },
      { type: 'mc-paragraph', text: '15. Which paragraph contains an explanation of why a proposed bike-sharing scheme was turned down?', options: ['A','B','C','D','E','F','G'], correct: 'C' },
      { type: 'mc-paragraph', text: '16. Which paragraph contains a reference to a person being unable to profit from their work?', options: ['A','B','C','D','E','F','G'], correct: 'F' },
      { type: 'mc-paragraph', text: '17. Which paragraph contains an explanation of the potential savings a bike-sharing scheme would bring?', options: ['A','B','C','D','E','F','G'], correct: 'C' },
      { type: 'mc-paragraph', text: '18. Which paragraph contains a reference to the problems a bike-sharing scheme was intended to solve?', options: ['A','B','C','D','E','F','G'], correct: 'A' },
      { type: 'multi-two', text: '19-20. Choose TWO letters. Which TWO statements are made about the Amsterdam bike-sharing scheme of 1999? (Select two options)', options: ['A','B','C','D','E'], correct: ['B','D'], optionTexts: {A:'It was initially opposed by a government department.',B:'It failed when a partner in the scheme withdrew support.',C:'It aimed to be more successful than the Copenhagen scheme.',D:'It was made possible by a change in people’s attitudes.',E:'It attracted interest from a range of bike designers.'} },
      { type: 'multi-two', text: '21-22. Choose TWO letters. Which TWO statements are made about Amsterdam today?', options: ['A','B','C','D','E'], correct: ['D','E'], optionTexts: {A:'Majority would like to ban cars from city.',B:'Little likelihood of another bike-sharing scheme.',C:'More trips by bike than any other transport.',D:'Bike-sharing would benefit public transport users.',E:'Reputation as cycle-friendly.'} },
      { type: 'fill-blank', text: '23. The first bike-sharing scheme was the idea of the Dutch group Provo. The people who belonged to this group were _______.', correct: 'activists' },
      { type: 'fill-blank', text: '24. They were concerned about damage to the environment and about _______.', correct: 'consumerism' },
      { type: 'fill-blank', text: '25. As well as painting some bikes white, they handed out _______ that condemned the use of cars.', correct: 'leaflets' },
      { type: 'fill-blank', text: '26. However, the scheme was not a great success: almost as quickly as Provo left the bikes around the city, the _______ took them away.', correct: 'police' }
    ];
    let html = '';
    questionsData.forEach((q, idx) => {
      const flaggedClass = flagged[idx] ? 'flagged' : '';
      html += `<div class="question-item ${flaggedClass}" data-qidx="${idx}">
        <div class="question-header">
          <span class="q-num">Q${idx+1}</span>
          <button class="flag-btn" data-qidx="${idx}">🚩</button>
        </div>
        <div class="question-text">${q.text}</div>
        <div class="options" id="q-${idx}">`;
      if (q.type === 'mc-paragraph') {
        q.options.forEach(opt => {
          const checked = answers[idx] === opt ? 'checked' : '';
          html += `<label><input type="radio" name="q${idx}" value="${opt}" ${checked}> ${opt}</label><br>`;
        });
      } else if (q.type === 'multi-two') {
        html += `<div class="multi-options">`;
        q.options.forEach(opt => {
          const checked = answers[idx] && answers[idx].includes(opt) ? 'checked' : '';
          html += `<label><input type="checkbox" name="q${idx}" value="${opt}" ${checked}> ${opt}. ${q.optionTexts[opt]}</label><br>`;
        });
        html += `</div>`;
      } else if (q.type === 'fill-blank') {
        html += `<input type="text" class="fill-input" data-qidx="${idx}" value="${answers[idx] || ''}" placeholder="Type your answer...">`;
      }
      html += `</div></div>`;
    });
    container.innerHTML = html;
    // attach event listeners for radios, checkboxes, text inputs
    for (let i = 0; i < questionsData.length; i++) {
      if (questionsData[i].type === 'mc-paragraph') {
        const radios = document.querySelectorAll(`input[name="q${i}"]`);
        radios.forEach(r => r.addEventListener('change', (e) => { answers[i] = e.target.value; updateProgressBar(); }));
      } else if (questionsData[i].type === 'multi-two') {
        const checks = document.querySelectorAll(`input[name="q${i}"]`);
        checks.forEach(c => c.addEventListener('change', (e) => {
          let selected = Array.from(checks).filter(ch => ch.checked).map(ch => ch.value);
          answers[i] = selected;
          updateProgressBar();
        }));
      } else if (questionsData[i].type === 'fill-blank') {
        const inp = document.querySelector(`#q-${i} .fill-input`);
        inp.addEventListener('input', (e) => { answers[i] = e.target.value.trim(); updateProgressBar(); });
      }
    }
    // flag buttons
    document.querySelectorAll('.flag-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.dataset.qidx);
        flagged[idx] = !flagged[idx];
        const parent = btn.closest('.question-item');
        if (flagged[idx]) parent.classList.add('flagged');
        else parent.classList.remove('flagged');
        e.stopPropagation();
      });
    });
  }

  function updateProgressBar() {
    let answered = 0;
    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
      if (answers[i] !== null && (Array.isArray(answers[i]) ? answers[i].length : answers[i] !== '')) answered++;
    }
    document.getElementById('answeredCount').innerText = answered;
    const percent = (answered / TOTAL_QUESTIONS) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
  }

  function attachHighlighters() {
    const passageDiv = document.getElementById('passageText');
    let activeColor = null;
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeColor = btn.dataset.color;
      });
    });
    passageDiv.addEventListener('mouseup', () => {
      const selection = window.getSelection();
      if (!selection.toString().trim() || !activeColor) return;
      const range = selection.getRangeAt(0);
      const span = document.createElement('span');
      span.className = `highlight-${activeColor}`;
      range.surroundContents(span);
      selection.removeAllRanges();
    });
    document.getElementById('clearHighlightsBtn').addEventListener('click', () => {
      const highlights = passageDiv.querySelectorAll('[class^="highlight-"]');
      highlights.forEach(span => {
        const parent = span.parentNode;
        parent.replaceChild(document.createTextNode(span.innerText), span);
        parent.normalize();
      });
    });
  }

  let timerRunning = true;
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!timerRunning || submitted) return;
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        handleSubmit(true);
        return;
      }
      timerSeconds--;
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }, 1000);
  }

  async function handleSubmit(auto = false) {
    if (submitted) return;
    if (!auto && !confirm('Are you sure? You cannot change your answers after submitting.')) return;
    timerRunning = false;
    submitted = true;
    // calculate raw score
    let rawScore = 0;
    // We need correct answers mapping
    const correctMap = [
      'E', 'C', 'F', 'C', 'A',   // 14-18
      ['B','D'], ['D','E'],         // 19-20, 21-22
      'activists', 'consumerism', 'leaflets', 'police' // 23-26
    ];
    for (let i=0; i<TOTAL_QUESTIONS; i++) {
      let userAns = answers[i];
      let correct = correctMap[i];
      if (i >= 5 && i <= 6) { // multiselect
        if (Array.isArray(userAns) && userAns.length === correct.length && correct.every(c => userAns.includes(c))) rawScore++;
      } else if (i >= 7) { // fill blank case-insensitive trimmed
        if (userAns && userAns.trim().toLowerCase() === correct.toLowerCase()) rawScore++;
      } else {
        if (userAns === correct) rawScore++;
      }
    }
    // band score conversion (max 13 -> scale to 40)
    const scaled = (rawScore / TOTAL_QUESTIONS) * 40;
    const band = getBandScore(scaled);
    // save to Supabase
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      await sb.from('reading_scores').upsert({
        user_id: user.id,
        passage_id: PASSAGE_ID,
        band_score: band,
        score_raw: rawScore,
        total: TOTAL_QUESTIONS,
        completed_at: new Date().toISOString()
      }, { onConflict: 'user_id, passage_id' });
    }
    // render results page
    showResultsPage(rawScore, TOTAL_QUESTIONS, band);
  }

  function getBandScore(scaled40) {
    const bands = [
      [39,9.0],[37,8.5],[35,8.0],[33,7.5],[30,7.0],[27,6.5],[23,6.0],[19,5.5],[15,5.0],[13,4.5],[10,4.0]
    ];
    for (let [minScore, band] of bands) {
      if (scaled40 >= minScore) return band;
    }
    if (scaled40 >= 39) return 9.0;
    if (scaled40 >= 37) return 8.5;
    if (scaled40 >= 35) return 8.0;
    if (scaled40 >= 33) return 7.5;
    if (scaled40 >= 30) return 7.0;
    if (scaled40 >= 27) return 6.5;
    if (scaled40 >= 23) return 6.0;
    if (scaled40 >= 19) return 5.5;
    if (scaled40 >= 15) return 5.0;
    if (scaled40 >= 13) return 4.5;
    if (scaled40 >= 10) return 4.0;
    return 3.5;
  }

  function showResultsPage(rawScore, total, band) {
    document.querySelector('.split-layout')?.remove();
    const app = document.getElementById('app');
    app.innerHTML += `
      <div style="max-width: 800px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 32px;">
        <div style="text-align: center;">
          <div style="width: 120px; height: 120px; background: var(--gold-light); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 2.5rem; font-weight: bold; color: var(--gold);">${band}</span>
          </div>
          <h2 style="margin-top: 1rem;">Your Band Score</h2>
          <p>${rawScore} / ${total} correct</p>
        </div>
        <a href="../free-reading/index.html" style="display: inline-block; margin-top: 2rem; background: var(--navy); color: white; padding: 0.6rem 1.5rem; border-radius: 40px; text-decoration: none;">← Back to Reading</a>
      </div>
    `;
    // also we could review each question, but for brevity we show summary
  }

  // Initialize auth modal and check session
  function init() {
    // Create modal element
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal-overlay';
    modalDiv.id = 'authModal';
    modalDiv.innerHTML = `
      <div class="modal-card">
        <h3>Sign in to access this passage</h3>
        <input type="email" id="loginEmail" placeholder="Email" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button class="btn-modal" id="modalSigninBtn">Sign in</button>
        <button class="btn-modal" id="modalCloseBtn" style="background:#ccc; margin-top:0.3rem;">Cancel</button>
      </div>
    `;
    document.body.appendChild(modalDiv);
    authModal = modalDiv;
    document.getElementById('modalSigninBtn').onclick = async () => {
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPassword').value;
      try {
        await signIn(email, pwd);
      } catch(e) {
        alert('Login failed: ' + e.message);
      }
    };
    document.getElementById('modalCloseBtn').onclick = () => hideSignInModal();
    // Check session and render
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        currentUser = session.user;
        renderTopBarLogged(currentUser);
        renderFullPage();
        startTimer();
      } else {
        renderTopBarUnlogged();
        showSignInModal();
      }
    });
  }
  init();
</script>
