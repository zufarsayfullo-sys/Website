<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up / Sign in</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 48px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #5a6e7c;
        }
        .tab-btn.active {
            color: #2e7d64;
            border-bottom: 3px solid #2e7d64;
            background: rgba(46,125,100,0.05);
        }
        .panel {
            padding: 2rem 1.8rem;
            display: none;
        }
        .panel.active { display: block; }
        .signup-panel { background: #2e7d64; color: white; }
        .signin-panel { background: white; }
        input, .phone-wrapper {
            width: 100%;
            margin: 0.5rem 0;
        }
        input {
            padding: 0.8rem;
            border-radius: 60px;
            border: none;
            font-size: 1rem;
        }
        .signup-panel input {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .signup-panel input::placeholder { color: rgba(255,255,255,0.7); }
        .signin-panel input {
            background: #f1f5f9;
            border: 1px solid #cbdde9;
        }
        .phone-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.2);
            border-radius: 60px;
            padding: 0 0.5rem;
        }
        .signin-panel .phone-wrapper { background: #f1f5f9; border: 1px solid #cbdde9; }
        .flag { font-size: 1.5rem; margin-right: 0.2rem; }
        .prefix { font-weight: 500; margin-right: 0.2rem; }
        .phone-input {
            flex: 1;
            background: transparent !important;
            border: none !important;
            padding: 0.8rem 0 !important;
            margin: 0 !important;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.8rem;
            border: none;
        }
        .btn-primary { background: white; color: #2e7d64; }
        .signin-panel .btn-primary { background: #2c3e50; color: white; }
        .btn-secondary {
            background: transparent;
            color: white;
            border: 1px solid white;
        }
        .signin-panel .btn-secondary {
            color: #2c5a7a;
            border: 1px solid #2c5a7a;
        }
        .message {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 40px;
        }
        .error { background: #fef2f2; color: #b91c1c; }
        .success { background: #e0f2e9; color: #2e7d64; }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" id="tabSignup">Sign up</button>
        <button class="tab-btn" id="tabSignin">Sign in</button>
    </div>
    <!-- Sign Up Panel -->
    <div id="signupPanel" class="panel signup-panel active">
        <input type="text" id="signupName" placeholder="Full name">
        <div class="phone-wrapper">
            <span class="flag">🇺🇿</span>
            <span class="prefix">+998</span>
            <input type="tel" id="signupPhone" class="phone-input" placeholder="90 123 45 67">
        </div>
        <input type="password" id="signupPassword" placeholder="Password">
        <button class="btn btn-primary" id="signupBtn">Create account</button>
        <button class="btn btn-secondary" id="laterSignupBtn">Maybe later</button>
        <div id="signupMsg" class="message"></div>
    </div>
    <!-- Sign In Panel -->
    <div id="signinPanel" class="panel signin-panel">
        <div class="phone-wrapper">
            <span class="flag">🇺🇿</span>
            <span class="prefix">+998</span>
            <input type="tel" id="signinPhone" class="phone-input" placeholder="90 123 45 67">
        </div>
        <input type="password" id="signinPassword" placeholder="Password">
        <button class="btn btn-primary" id="signinBtn">Sign in</button>
        <button class="btn btn-secondary" id="laterSigninBtn">Maybe later</button>
        <div id="signinMsg" class="message"></div>
    </div>
</div>
<script>
    // Supabase config
    const SUPABASE_URL = 'https://evhceswvapszaghnvmxl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2aGNlc3d2YXBzemFnaG52bXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTQwNzMsImV4cCI6MjA5MzM3MDA3M30.yV7tavgR7JKc45uSGtS8Lf6m1ZMuuvQ23hmAb8n6k3A';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzu5EGex28ZB01TjPhKvRUANTdtgoNvoHrC2LNBEsQF_jtwyBCu6DhpT7qLobF-RcUN/exec';

    function getFullPhone(partial) {
        let digits = partial.replace(/\D/g, '');
        return '+998' + digits;
    }
    function phoneToEmail(phone) {
        return phone.replace(/\+/g, 'p') + '@phone.local';
    }
    function showMessage(panel, text, isError) {
        let msgDiv = panel === 'signup' ? document.getElementById('signupMsg') : document.getElementById('signinMsg');
        msgDiv.textContent = text;
        msgDiv.className = 'message ' + (isError ? 'error' : 'success');
        setTimeout(() => { msgDiv.textContent = ''; msgDiv.className = 'message'; }, 5000);
    }
    function closeModal() {
        if (window.parent) window.parent.postMessage('authCancel', '*');
        // Also directly try to close the overlay (as backup)
        let modal = window.parent.document.getElementById('authModal');
        if (modal) modal.style.display = 'none';
    }

    // Sign Up logic
    document.getElementById('signupBtn').onclick = async () => {
        let name = document.getElementById('signupName').value.trim();
        let phonePartial = document.getElementById('signupPhone').value.trim();
        let password = document.getElementById('signupPassword').value;
        if (!name || !phonePartial || !password) {
            showMessage('signup', '❌ Please fill all fields', true);
            return;
        }
        let fullPhone = getFullPhone(phonePartial);
        let email = phoneToEmail(fullPhone);
        let btn = document.getElementById('signupBtn');
        btn.disabled = true; btn.textContent = 'Creating...';
        try {
            const { error } = await supabase.auth.signUp({
                email, password,
                options: { data: { name, phone: fullPhone } }
            });
            if (error) throw error;
            await fetch(SHEET_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone: fullPhone, timestamp: new Date().toISOString() })
            });
            showMessage('signup', '✅ Account created! You are now signed in.', false);
            if (window.parent) window.parent.postMessage('authSuccess', '*');
            setTimeout(() => { if (window.parent) window.parent.location.reload(); }, 1000);
        } catch (err) {
            console.error(err);
            showMessage('signup', '❌ ' + err.message, true);
        } finally {
            btn.disabled = false; btn.textContent = 'Create account';
        }
    };
    // Sign In logic
    document.getElementById('signinBtn').onclick = async () => {
        let phonePartial = document.getElementById('signinPhone').value.trim();
        let password = document.getElementById('signinPassword').value;
        if (!phonePartial || !password) {
            showMessage('signin', '❌ Please enter phone and password', true);
            return;
        }
        let fullPhone = getFullPhone(phonePartial);
        let email = phoneToEmail(fullPhone);
        let btn = document.getElementById('signinBtn');
        btn.disabled = true; btn.textContent = 'Signing in...';
        try {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            showMessage('signin', '✅ Signed in successfully!', false);
            if (window.parent) window.parent.postMessage('authSuccess', '*');
            setTimeout(() => { if (window.parent) window.parent.location.reload(); }, 1000);
        } catch (err) {
            console.error(err);
            showMessage('signin', '❌ ' + err.message, true);
        } finally {
            btn.disabled = false; btn.textContent = 'Sign in';
        }
    };
    // Later buttons
    document.getElementById('laterSignupBtn').onclick = closeModal;
    document.getElementById('laterSigninBtn').onclick = closeModal;
    // Tab switching
    let tabSignup = document.getElementById('tabSignup');
    let tabSignin = document.getElementById('tabSignin');
    let panelSignup = document.getElementById('signupPanel');
    let panelSignin = document.getElementById('signinPanel');
    tabSignup.onclick = () => {
        tabSignup.classList.add('active'); tabSignin.classList.remove('active');
        panelSignup.classList.add('active'); panelSignin.classList.remove('active');
    };
    tabSignin.onclick = () => {
        tabSignin.classList.add('active'); tabSignup.classList.remove('active');
        panelSignin.classList.add('active'); panelSignup.classList.remove('active');
    };
</script>
</body>
</html>
